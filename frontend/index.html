<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Secure Document Vault</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <div class="logo">
      <div class="logo-icon">🔐</div>
      <div>
        <div class="logo-text">SecureVault</div>
        <div class="logo-sub">Document Security Platform</div>
      </div>
    </div>

    <div id="alert-area"></div>

    <div id="login-form-section">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your secure document vault.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="identifier">Username or Email</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input
              class="form-input" type="text" id="identifier"
              placeholder="your@email.com or username"
              autocomplete="username" required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔑</span>
            <input
              class="form-input" type="password" id="password"
              placeholder="••••••••"
              autocomplete="current-password" required
            />
            <button type="button" class="input-toggle" id="toggle-pw">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">
          Sign In
        </button>
      </form>

      <div class="divider">or continue with</div>

      <div class="oauth-group">
        <a href="#" class="btn-oauth" id="github-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
          </svg>
          GitHub
        </a>
      </div>

      <p class="text-center text-muted mt-md">
        Don't have an account?
        <a href="/pages/register.html">Create one</a>
      </p>
    </div>

    <div id="twofa-section" style="display:none;">
      <h1 class="auth-title">Two-Factor Auth</h1>
      <p class="auth-subtitle">Enter the 6-digit code from your authenticator app.</p>

      <form id="twofa-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="totp-code">TOTP Code</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              class="form-input text-mono" type="text" id="totp-code"
              placeholder="000000"
              maxlength="6" inputmode="numeric"
              autocomplete="one-time-code" required
            />
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="twofa-btn">Verify</button>
      </form>

      <p class="text-center text-muted mt-md">
        <a href="#" id="back-to-login">← Back to login</a>
      </p>
    </div>

  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
